version: '3'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      # Admin user configuration
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@indyfit.com
      - ADMIN_PASSWORD=changeme123  # Change this in production!
      - ADMIN_FIRST_NAME=Admin
      - ADMIN_LAST_NAME=User
      # Database configuration
      - DATABASE_URL=postgresql://indyfit:indyfit_password@db:5432/indyfit
      - SECRET_KEY=dev_key_for_development  # Change this in production!
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=indyfit_password
      - POSTGRES_USER=indyfit
      - POSTGRES_DB=indyfit
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:  # Persistent volume for PostgreSQL database